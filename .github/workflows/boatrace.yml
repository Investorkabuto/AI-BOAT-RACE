name: Fetch boatrace

# 起動はアプリ（Cloudflare の定時処理、5分ごと）が workflow_dispatch で行う（src/jobs/fetch-dispatch.ts）
#   出走表（締切予定時刻と選手の基本情報）: 毎日 日本時間 7:30 と 9:30（2回目は1回目の取りこぼし対策。締切後のレースは変わらない）
#   番組表（公式テキストデータ B、出走表と基礎数値）: 前日の 18:00・19:30・22:00 に翌日分、当日の 7:00 に当日分（ファイルが前回と同じなら何もしない）
#   競走成績（公式テキストデータ K、展示タイム・進入・ST・天候・決まり手・払戻金）: 当日の 21:30・23:20 と、翌朝 6:30 に前日分（ファイルが前回と同じなら何もしない）
#   過去分（B・K から過去のレースを作る）: 毎晩 2:00 に、直近から3年前まで、取り込み済みでない日を新しい順に（1回で最大60日・40分）
#   公式結果: 結果が未取得のレース（舟券のあるレースと、当日の締切後の全レース）があるときに、10分おき
#   全レースの結果: 毎朝 6:00 に前日分（results-all。公開・振り返り用）
# GitHub の schedule は起動が遅れたり来なかったりするため（2026-11-04）、予備として残す:
#   出走表 7:30・9:30、結果 10:00〜23:59 の10分ごと（結果待ちのレースがなければ何もせずに終わる）
# アプリからの起動が止まったとき（GITHUB_TOKEN の権限不足など）でも、精算が止まらないようにするため。
# 取り込みは何度実行しても安全なので、アプリからの起動と重なっても問題ない
on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 0 * * *"
    - cron: "*/10 1-14 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "schedule / cards / records / history（日付なしなら過去分を直近から進める） / results / results-all / probe-cards / probe-records / probe-schedule / probe-result / probe-entrants（probe-* はアプリに書き込まず、解析結果を表示するだけ）"
        type: choice
        options: [results, schedule, cards, records, history, results-all, probe-cards, probe-records, probe-schedule, probe-result, probe-entrants]
        default: results
      date:
        description: "schedule / cards / records / results-all / probe-cards / probe-records / probe-schedule の日付（YYYY-MM-DD、省略時は今日）"
        type: string
        default: ""
      race:
        description: "probe-result / probe-entrants のレースID（例 20261103-12-07）"
        type: string
        default: ""

concurrency:
  group: fetch-boatrace
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Fetch and ingest
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          CMD: ${{ inputs.command }}
          DATE: ${{ inputs.date }}
          RACE: ${{ inputs.race }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$CMD" ]; then
            case "$SCHEDULE" in "30 22 * * *"|"30 0 * * *") CMD=schedule ;; *) CMD=results ;; esac
          fi
          ARGS=()
          [ -n "$DATE" ] && ARGS+=(--date "$DATE")
          [ -n "$RACE" ] && ARGS+=(--race "$RACE")
          python scripts/fetch_boatrace.py "$CMD" "${ARGS[@]}"

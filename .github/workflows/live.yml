name: Fetch live

# 締切前の直前情報とオッズを公式サイトから取得してアプリに送る（要件定義 決定64。scripts/boatrace_live.py）。
# アプリの定時処理（src/jobs/fetch-dispatch.ts の LIVE_SLOTS）が1日3回、終わる時刻（until）を付けて起動する。
# 結果の取得（boatrace.yml）とは別の concurrency にして、互いに待たないようにする。同じワークフローの次のランは、前のランが終わるまで待つ
on:
  workflow_dispatch:
    inputs:
      until:
        description: "この時刻（日本時間 HH:MM）で終える"
        type: string
        default: "23:40"

concurrency:
  group: fetch-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Fetch beforeinfo and odds until ${{ inputs.until }}
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          UNTIL: ${{ inputs.until }}
        run: python scripts/boatrace_live.py run --until "$UNTIL"

name: Test

on:
  push:
  pull_request:

# この作業に必要なのはリポジトリの読み取りだけ（GITHUB_TOKEN の権限を最小にする）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python3 -m py_compile scripts/fetch_boatrace.py scripts/boatrace_text.py
      - run: python3 -m unittest discover -s scripts/tests -v
